name: release-please

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm 11.5.1+; Node 22 ships npm 10.
      - run: npm install -g npm@^11.5.1
      # Checks run in ci.yml on every PR. Dev dependencies are still needed
      # because prepack builds the type declarations.
      - run: npm ci
      # Authenticates through the npm trusted publisher for this workflow;
      # no token needed, and provenance is attached automatically.
      - run: npm publish --access public
